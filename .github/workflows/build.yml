name: Compile Raylib to WebAssembly

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Clone Raylib Source
        uses: actions/checkout@v4
        with:
          repository: raysan5/raylib
          path: raylib

      - name: Build Raylib for Web
        run: |
          cd raylib/src
          emmake make PLATFORM=PLATFORM_WEB -j4
          if [ -f libraylib.web.a ]; then
            cp libraylib.web.a libraylib.a
          fi

      - name: Build Game via Makefile
        run: |
          # This runs your Makefile which compiles all your cpp files and links Raylib automatically!
          make

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Raylib Web Game</title>
    <style>
      body { background-color: #111; color: white; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
      canvas.emscripten { border: 0px none; background-color: black; width: 100%; max-height: 70vh; object-fit: contain; }
      #output { width: 100vw; height: 120px; background: #000; color: #0f0; font-family: monospace; font-size: 11px; overflow-y: scroll; border-top: 1px solid #333; padding: 5px; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    <textarea id="output" placeholder="Loading logs..."></textarea>
    <script type="text/javascript">
      var Module = {
        canvas: (function() { return document.getElementById('canvas'); })(),
        print: (function() {
          var element = document.getElementById('output');
          return function(text) {
            if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
            console.log(text);
            if (element) {
              element.value += text + "\n";
              element.scrollTop = element.scrollHeight;
            }
          };
        })(),
        printErr: function(text) {
          if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
          console.error(text);
          Module.print("ERROR: " + text);
        }
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
